services:
  xui:
    image: ghcr.io/aresqqqqq/3x-ui-ghostlink:latest
    container_name: xui-ghostlink
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      GHOSTLINK_LICENSE_HUB_URL: "https://auth.114514707.xyz"
      GHOSTLINK_GOMEMLIMIT: "96MiB"
      XUI_GOGC: "75"
      XUI_MEMORY_LIMIT: "256"
    volumes:
      - ./db:/etc/x-ui/
      - /etc/machine-id:/host/etc/machine-id:ro
      - /sys/class:/host/sys/class:ro
      - /sys/devices:/host/sys/devices:ro
      - ./cert:/root/cert/
      - ./acme:/root/.acme.sh/
    tty: true
    restart: unless-stopped
